<header class="intro-header personal-hero {% if include.home %}home-hero{% endif %}" style="background-image:linear-gradient(90deg,rgba(9,24,29,.8),rgba(9,24,29,.26)),url('{{ page.header-img | default: site.header-img | relative_url }}')"><div class="hero-inner"><p class="eyebrow">{{ include.label | default: 'DESIGN & NOTES' }}</p><h1>{{ page.title | default: '设计与记录' }}</h1><p class="hero-description">{{ page.description | default: site.description }}</p>{% if include.home %}<a class="hero-link" href="{{ '/works/' | relative_url }}">探索我的作品 <span>↗</span></a>{% endif %}</div></header>
