<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>网站管家</title><style>body{background:#f5f7f2;color:#24483b;font:18px -apple-system,sans-serif;margin:80px auto;max-width:700px;padding:30px}h1{font-size:44px}section{background:white;border:1px solid #d5dfd2;border-radius:18px;padding:30px;margin:25px 0}label{display:block;margin:20px 0}input{display:block;padding:14px;margin-top:10px;width:90%;border:1px solid #ccd8cb;border-radius:8px;font:inherit}button{background:#284e3e;color:white;border:0;border-radius:9px;padding:16px 24px;font:inherit;cursor:pointer}small{line-height:1.8;color:#66806b}</style><body><small>APPLE SILICON · 本机内容管理</small><h1>让创作拥有自己的家。</h1><p>不用安装开发工具，从这里开始维护你的网站。</p><p><button id="recent" hidden></button></p><section><h2>创建空白网站</h2><label>网站名称<input id="name" value="我的网站" maxlength="100"></label><label>一句话简介<input id="intro" placeholder="这里记录我的创作与思考"></label><button id="create">选择保存位置并创建</button><p><small>主题已准备好，不含原作者的作品或个人资料。创建只发生在本机。</small></p></section><section><h2>已有网站？</h2><p>打开采用本模板结构的 Jekyll 网站文件夹。</p><button id="open">选择网站文件夹</button></section><p id="message" role="status"></p><script src="welcome.js"></script></body></html>
